name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Every project runs, and one failing does not hide the others.
      fail-fast: false
      matrix:
        project:
          - 01_embedding_fair_comparison
          - 02_preprocessing_ablation
          - 03_reranker_ceiling
          - 04_near_duplicate_detection
          - 05_zipf_and_heaps
          - 06_ppmi_svd_vs_sgns
          - 07_smart_weighting_grid
          - 08_gzip_knn
          - 09_collocations
          - 10_relevance_feedback
          - 11_text_clustering
          - 12_gazetteer_ner
          - 13_language_id
          - 14_string_similarity
          - 15_sentence_boundaries
          - 16_stylometry
          - 17_topic_models
          - 18_tokenisation
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock is committed; setup-uv errors outright when its default
          # **/uv.lock glob matches nothing. Key the cache on pyproject.toml.
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --all-groups
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Test
        # No dataset and no network: every test in this lab uses constructed inputs,
        # so a Hugging Face outage cannot redden the build.
        run: uv run pytest -q
