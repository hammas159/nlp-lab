[project]
name = "reranker-ceiling"
version = "0.1.0"
description = "A reranker cannot retrieve what was never fetched. Reranking collapses the gap between retrievers from 10.2 points to 2.3."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3", "scikit-learn>=1.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
