[project]
name = "near-duplicate-detection"
version = "0.1.0"
description = "Exact hashing found 4 of 30 near-duplicates in Devign. Sixteen of the ones it missed carry conflicting labels."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "altair>=5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
