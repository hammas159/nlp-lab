[project]
name = "zipf-and-heaps"
version = "0.1.0"
description = "Five estimators of the Zipf exponent disagree, three of them do not estimate the same parameter, and the Heaps exponent is a function of corpus size."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
