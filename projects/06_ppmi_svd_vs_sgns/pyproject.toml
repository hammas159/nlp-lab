[project]
name = "ppmi-svd-vs-sgns"
version = "0.1.0"
description = "Skip-gram with negative sampling implicitly factorises a shifted PMI matrix. Transferring its hyperparameters to a counting model closes the gap."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]
sgns = ["gensim>=4.3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
