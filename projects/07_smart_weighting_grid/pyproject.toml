[project]
name = "smart-weighting-grid"
version = "0.1.0"
description = "\"TF-IDF\" names 45 different weighting schemes. The spread between them is larger than the gap between the methods people compare."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
