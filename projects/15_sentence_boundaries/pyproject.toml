[project]
name = "sentence-boundaries"
version = "0.1.0"
description = "Sentence splitting is treated as solved preprocessing. Two reasonable splitters disagree on a measurable share of boundaries, and the disagreements are not random."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
