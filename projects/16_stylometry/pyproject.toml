[project]
name = "stylometry"
version = "0.1.0"
description = "Authorship attribution on code is mostly topic classification. Remove the identifiers and most of the accuracy goes with them."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
