[project]
name = "topic-models"
version = "0.1.0"
description = "Topic models are compared on coherence. Coherence and the task do not pick the same winner, and the input representation moves both more than the model does."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
