[project]
name = "reranking-depth"
version = "0.1.0"
description = "Project 03 fixed the reranker's window at 50 and its whole finding is a function of that number. This sweeps it."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.5"]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
