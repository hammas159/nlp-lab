[project]
name = "pooling"
version = "0.1.0"
description = "Pooling is presented as a free hyperparameter. A sentence encoder is trained with one, and swapping it measures the mismatch rather than the pooling."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]
encode = ["torch>=2", "transformers>=4.40"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
