[project]
name = "urdu-morphology"
version = "0.1.0"
description = "Project 18 found subwords buy nothing for a lexical retriever, and said so only for English. This is the morphologically rich language it named."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "tokenizers>=0.15"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
