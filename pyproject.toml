[project]
name = "embedding-fair-comparison"
version = "0.1.0"
description = "Most embedding comparisons are training-data comparisons in disguise. Same corpus, same queries, same dimensions - and BM25 as the baseline nobody reports."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.5"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3", "gensim>=4.3"]
ui = ["streamlit>=1.40", "altair>=5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
